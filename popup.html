<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 system-ui, "Segoe UI", sans-serif; margin: 0; width: 270px; }
  main { padding: 14px; }
  .state { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 10px; }
  .state .icon { font-size: 20px; }
  .note { font-size: 11px; opacity: .6; margin-bottom: 10px; }
  button { width: 100%; padding: 9px 0; border: 0; border-radius: 8px; background: #d93025; color: #fff;
           font-size: 14px; cursor: pointer; }
  button.blue { background: #1a73e8; }
  input { width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 8px;
          border: 1px solid rgba(128,128,128,.5); background: transparent; color: inherit;
          font-size: 13px; text-align: center; margin-bottom: 8px; }
  .err { color: #d93025; font-size: 12px; min-height: 15px; margin-top: 6px; }
  .devtoggle { display: flex; align-items: center; gap: 6px; font-size: 12px; opacity: .85; margin-top: 10px; }
  .devtoggle input { width: auto; }
  footer { padding: 8px 14px 10px; font-size: 11px; opacity: .6; border-top: 1px solid rgba(128,128,128,.2); }
  footer a { cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
  <main>
    <div class="state"><span class="icon" id="icon">…</span><span id="stateText">Loading…</span></div>
    <div class="note" id="note"></div>
    <div id="setupBox" hidden>
      <button class="blue" id="setupBtn">Set up password</button>
    </div>
    <div id="unlockedBox" hidden>
      <button id="lockBtn">🔒 Lock now</button>
      <label class="devtoggle"><input type="checkbox" id="idleToggle"> Idle auto-lock on this computer</label>
    </div>
    <div id="lockedBox" hidden>
      <form id="unlockForm">
        <input id="pw" type="password" placeholder="Password" autocomplete="off">
        <button class="blue" type="submit">Unlock this device</button>
      </form>
      <div class="err" id="err"></div>
    </div>
  </main>
  <footer><a id="openOptions">Settings</a> · Ctrl+Shift+L to lock · Lock state never syncs</footer>
  <script src="popup.js"></script>
</body>
</html>
