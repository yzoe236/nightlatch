<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Locked · Nightlatch</title>
<style>
  :root { --bg: #0b0d12; --fg: #e8eaed; --sub: rgba(232,234,237,.55); --input-bg: #202124;
          --input-border: #3c4043; --accent: #8ab4f8; --accent-fg: #202124; --err: #f28b82; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, "Segoe UI", sans-serif;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { text-align: center; width: 300px; padding: 24px; }
  .lock { font-size: 42px; }
  h1 { font-size: 16px; font-weight: 600; margin: 12px 0 2px; }
  .sub { font-size: 12px; color: var(--sub); margin-bottom: 18px; }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--input-border);
          background: var(--input-bg); color: var(--fg); font-size: 14px; outline: none; text-align: center; }
  input:focus { border-color: var(--accent); }
  button { width: 100%; margin-top: 10px; padding: 9px 0; border: 0; border-radius: 8px; background: var(--accent);
           color: var(--accent-fg); font-size: 14px; font-weight: 600; cursor: pointer; }
  .err { color: var(--err); font-size: 12px; min-height: 16px; margin-top: 8px; }
  .foot { font-size: 11px; opacity: .4; margin-top: 22px; }
</style>
</head>
<body>
  <div class="card">
    <div class="lock">🔒</div>
    <h1>Profile Locked</h1>
    <div class="sub">This page is unavailable while locked</div>
    <form id="f">
      <input id="pw" type="password" placeholder="Password" autocomplete="off" autofocus>
      <button type="submit">Unlock</button>
    </form>
    <div class="err" id="err"></div>
    <div class="foot">Nightlatch · Lock state is per-device and never syncs</div>
  </div>
  <script src="themes.js"></script>
  <script src="locked.js"></script>
</body>
</html>
